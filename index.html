body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 14px 50px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:18px;margin:26px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--ac)}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.wrap{display:flex;flex-wrap:wrap;gap:12px}
#viewer{position:relative;flex:1 1 460px;height:580px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#tip{position:absolute;left:10px;top:10px;padding:3px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13px;display:none;direction:ltr}
#hud{position:absolute;left:10px;bottom:10px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;line-height:1.6;direction:ltr;text-align:left;opacity:.96;max-width:62%}
#hud b{font-size:20px;color:var(--ac)}#hud .l{color:var(--mut)}
#dp{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:5px;direction:ltr}
#dp button{font-size:18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;touch-action:none;user-select:none}
#dp button:active{background:var(--acbg);border-color:var(--ac)}
.side{flex:1 1 210px;font-size:13px}.pn{font-size:12px;color:var(--mut);margin:10px 0 4px}.pn:first-child{margin-top:0}
.sl{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}
.bt{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.bt.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}.bt.es{border-color:var(--bad);color:var(--bad);font-weight:700}.bt.es.on{background:var(--bad);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:6px}input[type=range]{width:100%}
#info{padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);line-height:1.6}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--acbg)}tr:last-child td{border-bottom:0}
tbody tr.k{cursor:pointer}tbody tr.k:hover,tbody tr.on{background:var(--acbg)}tbody tr.on{outline:2px solid var(--ac);outline-offset:-2px}
.s{color:var(--ok);font-weight:600}.p,.t,.a{color:var(--warn);font-weight:600}.a{color:#2e7dd6}
ul{margin:0;padding-inline-start:20px}li{margin:5px 0}footer{margin-top:24px;color:var(--mut);font-size:12.5px}
